<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SirJeff's Party</title>
<meta name="description" content="Welcome to SirJeff's party.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1f1147;
    --text: #fff4e0;
    --pink: #ff4f8b;
    --cyan: #3ddcff;
    --yellow: #ffd23f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Outfit", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    overflow-x: hidden;
  }
  main { max-width: 40rem; text-align: left; position: relative; z-index: 1; }
  h1 {
    font-family: "Bagel Fat One", "Arial Black", system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(3rem, 14vw, 7.5rem);
    line-height: 0.95;
    margin: 0 0 1.5rem;
    letter-spacing: 0.01em;
    color: var(--yellow);
    text-shadow: 0.05em 0.05em 0 var(--pink), 0.1em 0.1em 0 var(--cyan);
  }
  p { font-size: 1.2rem; line-height: 1.6; max-width: 32rem; margin: 0 0 2rem; }
  button {
    font: inherit;
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--bg);
    background: var(--yellow);
    border: 0;
    border-radius: 999px;
    padding: 0.9rem 1.8rem;
    cursor: pointer;
    box-shadow: 0 0.3rem 0 var(--pink);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:active { transform: translateY(0.2rem); box-shadow: 0 0.1rem 0 var(--pink); }
  button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
</style>
</head>
<body>
<main>
  <h1>SirJeff’s party</h1>
  <!-- Edit the text below to say whatever you want. -->
  <p>You’re invited. Pull up a chair, grab a drink, and stay a while.</p>
  <button id="go" type="button">Throw confetti</button>
</main>
<canvas id="c" aria-hidden="true"></canvas>
<script>
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const colors = ["#ff4f8b", "#3ddcff", "#ffd23f", "#fff4e0"];
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let pieces = [];
  let running = false;

  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener("resize", resize);
  resize();

  function burst() {
    if (reduceMotion) return;
    for (let i = 0; i < 160; i++) {
      pieces.push({
        x: canvas.width / 2,
        y: canvas.height * 0.6,
        vx: (Math.random() - 0.5) * 18,
        vy: -Math.random() * 18 - 4,
        size: Math.random() * 8 + 5,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.4,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.y < canvas.height + 20);
    for (const p of pieces) {
      p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vx *= 0.99;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    }
    if (pieces.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }

  document.getElementById("go").addEventListener("click", burst);
</script>
</body>
</html>
