<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gromit Mug | SirJeff Supply</title>
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
<style>
  :root { --bg:#f6f6f4; --text:#111; --muted:#6b6b68; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif; font-weight:300; min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; padding:1.5rem 2rem; font-size:.95rem; }
  header a { color:inherit; text-decoration:none; }
  main { flex:1; display:grid; grid-template-columns:1.2fr 1fr; align-items:center; gap:3rem; padding:1rem 2rem 3rem; max-width:80rem; width:100%; margin:0 auto; }
  .photo { display:grid; place-items:center; }
  .photo img { width:100%; max-width:34rem; height:auto; mix-blend-mode:multiply; }
  h1 { font-weight:300; font-size:clamp(2.2rem,5vw,4rem); letter-spacing:.02em; margin:0 0 .5rem; line-height:1.05; }
  .price { font-size:1.4rem; margin:0 0 2rem; }
  .desc { color:var(--muted); max-width:24rem; line-height:1.6; margin:0 0 2rem; }
  button { font:inherit; font-weight:400; color:#fff; background:var(--text); border:0; padding:1rem 3rem; cursor:pointer; letter-spacing:.04em; }
  button:hover { background:#333; }
  button:focus-visible { outline:3px solid #2a6cff; outline-offset:3px; }
  #msg { margin-top:1.25rem; min-height:1.5rem; color:var(--muted); }
  footer { padding:1.5rem 2rem; color:var(--muted); font-size:.85rem; }
  @media (max-width:760px) { main { grid-template-columns:1fr; gap:1.5rem; } }
</style>
</head>
<body>
<header>
  <a href="/">SirJeff Supply</a>
  <span>Cart (<span id="count">0</span>)</span>
</header>
<main>
  <div class="photo"><img src="gromit-mug.png" alt="Ceramic Gromit mug with a large brown nose, white eyes and a brown ear handle"></div>
  <section>
    <h1>Gromit Mug</h1>
    <p class="price">$1,000.00</p>
    <p class="desc">Glazed ceramic. Cream body, brown nose, one handle. One size. One product.</p>
    <button id="add" type="button">Add to cart</button>
    <p id="msg" role="status"></p>
  </section>
</main>
<footer>pls im broke</footer>
<script>
  let n = 0;
  document.getElementById("add").addEventListener("click", () => {
    n++;
    document.getElementById("count").textContent = n;
    document.getElementById("msg").textContent = "";
  });
</script>
</body>
</html>
